<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>特養マップ｜千葉県</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
:root{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;color:#17352f;background:#f5f7f5}*{box-sizing:border-box}body{margin:0}.app{display:grid;grid-template-columns:360px 1fr;height:100dvh}.side{background:#fff;border-right:1px solid #e2e8e4;display:flex;flex-direction:column;min-height:0}.top{padding:24px 20px 12px}h1{font-size:23px;margin:0 0 6px;letter-spacing:-.03em}.sub{font-size:12px;color:#71837c;margin:0 0 20px}.notice{padding:12px 14px;border-radius:12px;background:#f0f5f0;color:#4d655a;font-size:12px;line-height:1.7;margin-bottom:14px}input,select,button{font:inherit}input,select{width:100%;border:1px solid #d5e0da;border-radius:10px;padding:11px;background:white;color:#193a30}.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:9px 0}.primary{border:0;background:#177a5a;color:white;border-radius:10px;padding:11px 14px;cursor:pointer;font-weight:700}.secondary{background:white;border:1px solid #cbddd3;color:#276b56;border-radius:10px;padding:10px;cursor:pointer}.buttons{display:flex;gap:8px}.buttons>*{flex:1}.count{font-size:12px;color:#71837c;padding:12px 20px;border-top:1px solid #edf0ee}.results{overflow:auto;flex:1}.facility{padding:16px 20px;border-top:1px solid #edf0ee;cursor:pointer}.facility:hover{background:#f5faf7}.name{font-weight:750;font-size:14px;margin-bottom:7px}.addr{font-size:12px;color:#768880}.meta{margin-top:9px;display:flex;align-items:center;gap:7px;font-size:12px}.pill{display:inline-flex;border-radius:50px;background:#e8f4ec;color:#127747;padding:4px 9px;font-weight:700}.pill.unknown{background:#edf0ee;color:#697b72}.map-wrap{position:relative}#map{height:100%;width:100%}.map-overlay{position:absolute;z-index:800;top:16px;right:16px;padding:12px 14px;background:#fff;border-radius:12px;box-shadow:0 3px 18px #284a3920;font-size:12px}.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}.pin{background:#157959;color:#fff;border:2px solid #fff;border-radius:50%;width:34px;height:34px;display:grid;place-items:center;box-shadow:0 2px 8px #183c2e55;font-size:12px;font-weight:750}.pin.low{background:#15976a}.pin.mid{background:#cf942d}.pin.high{background:#d65e56}.pin.unknown{background:#84968a}.leaflet-div-icon{border:0;background:transparent}.popup h3{margin:0 0 9px;font-size:16px}.popup p{margin:5px 0;color:#53685d}.popup a{color:#087b56}.empty{padding:25px 20px;color:#71837c;font-size:13px;line-height:1.8}.footer{font-size:11px;color:#85938c;padding:10px 20px;border-top:1px solid #edf0ee}@media(max-width:750px){.app{grid-template-columns:1fr;grid-template-rows:46dvh 54dvh}.side{grid-row:2}.map-wrap{grid-row:1}.top{padding:14px}.top h1{font-size:18px}.sub{margin-bottom:7px}.notice{margin-bottom:6px}.map-overlay{top:8px;right:8px}.count{padding:7px 14px}.facility{padding:10px 14px}}
</style></head><body><main class="app"><section class="side"><div class="top"><h1>千葉県 特養マップ</h1><p class="sub">施設の場所と待機状況をひと目で確認</p><div class="notice">試作版です。施設データをCSVから読み込むと地図に反映されます。待機人数は出典と更新日を確認してご利用ください。</div><input id="q" type="search" placeholder="施設名・住所で検索"><div class="filters"><select id="city"><option value="">全市区町村</option></select><select id="waiting"><option value="">待機人数：すべて</option><option value="10">10人以下</option><option value="30">30人以下</option><option value="50">50人以下</option></select></div><div class="buttons"><button class="primary" id="import">CSVを読み込む</button><button class="secondary" id="example">CSV見本を保存</button></div><input type="file" id="file" accept=".csv,text/csv" hidden></div><div class="count" id="count">施設データは未登録です</div><div class="results" id="list"><div class="empty">まず「CSV見本を保存」から入力形式を確認し、施設データを読み込んでください。<br>施設の緯度・経度を指定すると地図上に表示されます。</div></div><div class="footer">個人用の試作品 · 地図 © OpenStreetMap contributors</div></section><section class="map-wrap"><div id="map"></div><div class="map-overlay"><b>待機人数</b><div class="legend"><span><i class="dot" style="background:#15976a"></i>10人以下</span><span><i class="dot" style="background:#cf942d"></i>11〜30人</span><span><i class="dot" style="background:#d65e56"></i>31人以上</span><span><i class="dot" style="background:#84968a"></i>不明</span></div></div></section></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const map=L.map('map',{zoomControl:false}).setView([35.61,140.13],9);L.control.zoom({position:'bottomright'}).addTo(map);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap contributors',maxZoom:19}).addTo(map);let all=[],markers=L.layerGroup().addTo(map);const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function level(n){return n==null||n===0?'unknown':n<=30?'low':n<=60?'mid':n<=100?'high':n<=150?'higher':'highest'}
function parseCSV(s){s=s.replace(/^\uFEFF/,'');let rows=[],row=[],cell='',quoted=false;for(let i=0;i<s.length;i++){let c=s[i];if(c==='"'){if(quoted&&s[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&s[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x))rows.push(row);row=[];cell=''}else cell+=c}row.push(cell);if(row.some(x=>x))rows.push(row);return rows}
function ingest(txt){const rows=parseCSV(txt);if(!rows.length)throw Error('CSVが空です');const head=rows.shift().map(x=>x.trim()),required=['施設名','住所','緯度','経度'];for(const h of required)if(!head.includes(h))throw Error('必須列がありません：'+h);const v=(r,key)=>r[head.indexOf(key)]??'';all=rows.map(r=>{const lat=Number(v(r,'緯度')),lng=Number(v(r,'経度'));const raw=v(r,'待機人数').trim();return{name:v(r,'施設名').trim(),address:v(r,'住所').trim(),city:v(r,'市区町村').trim(),wait:raw===''||raw==='-'?null:Number(raw),date:v(r,'更新日'),url:v(r,'URL'),feature:v(r,'特徴'),lat,lng}}).filter(x=>x.name&&Number.isFinite(x.lat)&&Number.isFinite(x.lng)&&x.lat>34&&x.lat<37&&x.lng>139&&x.lng<141&&Number.isFinite(x.wait??0));localStorage.setItem('tokuyo-map-csv',txt);populate();draw(true)}
function populate(){const old=$('city').value;const cities=[...new Set(all.map(x=>x.city).filter(Boolean))].sort();$('city').innerHTML='<option value="">全市区町村</option>'+cities.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');if(cities.includes(old))$('city').value=old}
function draw(fit=false){markers.clearLayers();const q=$('q').value.toLowerCase(),city=$('city').value,w=$('waiting').value;const visible=all.filter(x=>(!q||(x.name+x.address).toLowerCase().includes(q))&&(!city||x.city===city)&&(!w||(x.wait!==null&&x.wait<=Number(w))));$('count').textContent=`${visible.length}施設を表示 / 登録${all.length}施設`;$('list').innerHTML=visible.length?'':'<div class="empty">条件に一致する施設はありません。</div>';const bounds=[];for(const f of visible){const cls=level(f.wait),icon=L.divIcon({html:`<div class="pin ${cls}">${f.wait??'?'}</div>`,iconSize:[34,34],iconAnchor:[17,17]});const m=L.marker([f.lat,f.lng],{icon}).addTo(markers).bindTooltip(`${esc(f.name)}｜待機 ${f.wait??'不明'}人`,{direction:'top'}).bindPopup(`<div class="popup"><h3>${esc(f.name)}</h3><p>${esc(f.address)}</p><p><b>待機人数：${f.wait??'不明'}人</b></p><p>更新日：${esc(f.date||'不明')}</p>${f.feature?`<p>${esc(f.feature)}</p>`:''}${/^https:\/\//.test(f.url)?`<p><a href="${esc(f.url)}" target="_blank" rel="noopener noreferrer">元の施設情報を開く ↗</a></p>`:''}</div>`);bounds.push([f.lat,f.lng]);const el=document.createElement('article');el.className='facility';el.innerHTML=`<div class="name">${esc(f.name)}</div><div class="addr">${esc(f.address)}</div><div class="meta"><span class="pill ${cls==='unknown'?'unknown':''}">待機 ${f.wait??'不明'}人</span><span>更新：${esc(f.date||'不明')}</span></div>`;el.onclick=()=>{map.setView([f.lat,f.lng],14);m.openPopup()};$('list').append(el)}if(fit&&bounds.length)map.fitBounds(bounds,{padding:[40,40],maxZoom:13})}
for(const id of ['q','city','waiting'])$(id).addEventListener(id==='q'?'input':'change',()=>draw());$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{ingest(await f.text())}catch(err){alert(err.message)}e.target.value=''};
$('example').onclick=()=>{const example='施設名,住所,市区町村,待機人数,更新日,特徴,URL,緯度,経度\n"サンプル特養（架空）","千葉県柏市（架空）",柏市,12,2026-11-06,"サンプルデータです",,35.861,139.971\n"サンプル施設B（架空）","千葉県松戸市（架空）",松戸市,5,2026-11-06,"サンプルデータです",,35.784,139.901';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+example],{type:'text/csv;charset=utf-8'}));a.download='特養マップ_CSV見本.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};try{const saved=localStorage.getItem('tokuyo-map-csv');if(saved)ingest(saved)}catch(e){console.warn(e)}
</script><link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"><script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script><script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.4/leaflet-maplibre-gl.js"></script><script src="careoffer-data.js"></script></body></html>
